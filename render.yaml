# ============================================================
# LiquiBot — Render deployment
#
# Your LIVE service (liquibot-back.onrender.com) is a NATIVE Node
# service with Root Directory = backend. Use the "native" service
# below OR set env vars manually on the existing service.
#
# REQUIRED on the Web Service Environment:
#   DATABASE_URL  = Render Postgres Internal Database URL
#   JWT_SECRET    = openssl rand -hex 32
#   EA_API_KEY    = same string as MT5 EA ApiKey input
#   PORT          = usually auto-set by Render (do not hardcode localhost)
# ============================================================

databases:
  - name: liquibot-db
    databaseName: liquibot
    user: liquibot
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ---- Native Node (matches current liquibot-back deploy path) ----
  - type: web
    name: liquibot-back
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /test
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: liquibot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EA_API_KEY
        sync: false
      - key: MT5_BRIDGE_API_KEY
        sync: false
      - key: PYTHON_PATH
        value: python3
      - key: ALLOWED_ORIGINS
        value: "https://*.expo.dev,https://*.onrender.com"
      - key: AI_TRADING_ENABLED
        value: "false"
      - key: AI_MIN_CONFIDENCE
        value: "0.65"
      - key: AI_CONTRADICTION_VETO_THRESHOLD
        value: "0.55"
      - key: CL_MIN_SAMPLES
        value: "20"
      - key: CL_TRAIN_EVERY_N
        value: "15"
      - key: CL_TRAIN_EPOCHS
        value: "60"

  # ---- Optional: full Docker (Node + PyTorch) for serious cloud training ----
  # Uncomment / create separately if you need in-container torch training.
  # - type: web
  #   name: liquibot-backend
  #   runtime: docker
  #   dockerfilePath: ./backend/Dockerfile
  #   dockerContext: .
  #   plan: standard
  #   healthCheckPath: /test
  #   envVars:
